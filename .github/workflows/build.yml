name: Build & Release BLAM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      # Code signing is automatic when the certificate secrets exist and skipped when they don't.
      # Per-OS secrets (MAC_CSC_LINK / WIN_CSC_LINK ...) win; plain CSC_LINK / CSC_KEY_PASSWORD are the fallback.
      # See README → "Code signing".
      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
          MAC_PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          WIN_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          WIN_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$MAC_LINK" ]; then
                export CSC_LINK="$MAC_LINK" CSC_KEY_PASSWORD="$MAC_PASS" CSC_IDENTITY_AUTO_DISCOVERY=true
                echo "macOS code signing: ENABLED"
                if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASS" ] && [ -n "$NOTARY_TEAM" ]; then
                  export APPLE_ID="$NOTARY_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASS" APPLE_TEAM_ID="$NOTARY_TEAM"
                  echo "macOS notarization: ENABLED"
                else
                  echo "::notice::macOS notarization skipped (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID not all set)"
                fi
              else
                echo "::notice::macOS code signing skipped (no MAC_CSC_LINK / CSC_LINK secret) — building unsigned"
              fi ;;
            Windows)
              if [ -n "$WIN_LINK" ]; then
                export WIN_CSC_LINK="$WIN_LINK" WIN_CSC_KEY_PASSWORD="$WIN_PASS"
                echo "Windows code signing: ENABLED"
              else
                echo "::notice::Windows code signing skipped (no WIN_CSC_LINK / CSC_LINK secret) — building unsigned"
              fi ;;
          esac
          npx electron-builder --publish never
      - name: Verify signature
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP=$(ls -d dist/mac*/BLAM.app | head -1)
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || echo "App is not signed"
            spctl -a -vv "$APP" 2>&1 || echo "Gatekeeper: not accepted (expected for unsigned or un-notarized builds)"
          else
            powershell -NoProfile -Command "Get-ChildItem dist/*.exe | ForEach-Object { \$s = Get-AuthenticodeSignature \$_.FullName; Write-Host \$_.Name \$s.Status \$s.SignerCertificate.Subject }"
          fi
      - name: Launch test (Linux, packaged app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          BLAM_SMOKE=1 timeout 120 xvfb-run -a ./dist/linux-unpacked/blam --no-sandbox
      - name: Launch test (macOS, packaged app)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          APP=$(ls -d dist/mac*/BLAM.app | head -1)
          echo "Testing $APP"
          BLAM_SMOKE=1 "$APP/Contents/MacOS/BLAM"
      - name: Launch test (Windows, packaged app)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BLAM_SMOKE = "1"
          $p = Start-Process -FilePath ".\dist\win-unpacked\BLAM.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "BLAM did not finish self-test" }
          if ($p.ExitCode -ne 0) { throw "BLAM self-test failed with exit code $($p.ExitCode)" }
          Write-Host "BLAM self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: BLAM-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    # Only main publishes. Branch runs (workflow_dispatch) just build and launch-test.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check the tag for this version
        id: tag
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            AT=$(git rev-list -n 1 "$TAG")
            if [ "$AT" != "${{ github.sha }}" ]; then
              echo "::warning::$TAG already exists at $AT, not at ${{ github.sha }}. Not publishing, so the release assets always match their tag. Bump \"version\" in package.json to cut a new release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: steps.tag.outputs.publish == 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[?v?"v"\\]?([ ]|$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md || true
          {
            echo "## BLAM — Bitcoin Labz Asset Manager v$V"
            echo
            if [ -s notes.md ]; then echo "### What's new"; cat notes.md; echo; fi
            echo "### Download for your computer"
            echo "- **Windows:** \`BLAM-Setup-$V.exe\` (installer) or \`BLAM-Portable-$V.exe\` (no install)"
            echo "- **macOS (Intel + Apple Silicon):** \`BLAM-$V-mac-universal.dmg\` — first launch: right-click BLAM → Open"
            echo "- **Linux:** \`.AppImage\` (any distro) or \`.deb\` (Ubuntu/Debian)"
            echo
            echo "Windows SmartScreen may say \"Windows protected your PC\" because the app isn't code-signed yet — click **More info → Run anyway**."
            echo
            echo "All data stays on your computer. See the README for details."
          } > body.md
          cat body.md
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
        if: steps.tag.outputs.publish == 'true'
      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BLAM v${{ steps.v.outputs.version }}
          make_latest: true
          body_path: body.md
          files: artifacts/*
          overwrite_files: true
