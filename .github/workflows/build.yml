name: Build & Release BLAM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Launch test (Linux, packaged app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          BLAM_SMOKE=1 timeout 120 xvfb-run -a ./dist/linux-unpacked/blam --no-sandbox
      - name: Launch test (macOS, packaged app)
        if: runner.os == 'macOS'
        run: BLAM_SMOKE=1 timeout 120 "./dist/mac-universal/BLAM.app/Contents/MacOS/BLAM"
      - name: Launch test (Windows, packaged app)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BLAM_SMOKE = "1"
          $p = Start-Process -FilePath ".\dist\win-unpacked\BLAM.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "BLAM did not finish self-test" }
          if ($p.ExitCode -ne 0) { throw "BLAM self-test failed with exit code $($p.ExitCode)" }
          Write-Host "BLAM self-test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: BLAM-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BLAM v${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            ## BLAM — Bitcoin Labz Asset Manager v${{ steps.v.outputs.version }}

            **Download for your computer:**
            - **Windows:** `BLAM-Setup-${{ steps.v.outputs.version }}.exe` (installer) or `BLAM-Portable-${{ steps.v.outputs.version }}.exe` (no install)
            - **macOS (Intel + Apple Silicon):** `BLAM-${{ steps.v.outputs.version }}-mac-universal.dmg` — first launch: right-click BLAM → Open
            - **Linux:** `.AppImage` (any distro) or `.deb` (Ubuntu/Debian)

            Windows SmartScreen may say "Windows protected your PC" because the app isn't code-signed yet — click **More info → Run anyway**.

            All data stays on your computer. See the README for details.
          files: artifacts/*
          overwrite_files: true
