<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- BLAM logo: the app's line-style ₿ on the orange BLAM tile. Source for build/icon.png and the phone icons. -->
  <defs>
    <radialGradient id="tile" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#ffc066"/>
      <stop offset="0.5" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#b8620a"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  <!-- Same ₿ path as the in-app "bitcoin" icon (24-unit grid), scaled and centred -->
  <g transform="translate(512 512) scale(24) translate(-12 -12)" fill="none" stroke="#1a0f00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5v14M13 5v2M13 17v2"/>
    <path d="M7 7h7.5a2.5 2.5 0 010 5H7h8a2.5 2.5 0 010 5H7"/>
  </g>
</svg>
