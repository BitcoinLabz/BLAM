<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- BLAM logo (option B): orange line-style ₿ on a dark tile. Source for build/icon.png and the phone icons. -->
  <defs>
    <radialGradient id="tile" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#2c241b"/>
      <stop offset="1" stop-color="#14100c"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc066"/>
      <stop offset="1" stop-color="#f7931a"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#f7931a" stroke-opacity=".18" stroke-width="3"/>
  <!-- Same ₿ path as the in-app "bitcoin" icon (24-unit grid), scaled and centred -->
  <g transform="translate(512 512) scale(24) translate(-12 -12)" fill="none" stroke="url(#glyph)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5v14M13 5v2M13 17v2"/>
    <path d="M7 7h7.5a2.5 2.5 0 010 5H7h8a2.5 2.5 0 010 5H7"/>
  </g>
</svg>
